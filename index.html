<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>佛法足跡</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink:       #1a1612;
  --ink-light: #3d342a;
  --ink-faint: #6b5d50;
  --rice:      #f4efe6;
  --rice-warm: #ece4d2;
  --rice-deep: #e5dcc8;
  --gold:      #b8952a;
  --gold-lt:   #d4ac3a;
  --gold-pale: rgba(184,149,42,0.12);
  --verm:      #9b3a2a;
  --mist:      rgba(244,239,230,0.90);
  --shadow:    rgba(26,22,18,0.09);
  --border:    rgba(184,149,42,0.18);
}
*{margin:0;padding:0;box-sizing:border-box;}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--rice)}
::-webkit-scrollbar-thumb{background:rgba(184,149,42,0.3);border-radius:3px}

body {
  background:var(--rice); color:var(--ink); font-family:'Noto Serif TC',serif; min-height:100vh;
}
body::before {
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 90% 50% at 10% 15%, rgba(175,160,130,0.16) 0%,transparent 65%),
    radial-gradient(ellipse 60% 70% at 90% 80%, rgba(155,140,110,0.13) 0%,transparent 65%);
  pointer-events:none;z-index:0;
}

/* ── HEADER ── */
.site-header {
  position:sticky;top:0;z-index:100;
  background:rgba(244,239,230,0.94); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border); padding:0 48px;
  display:flex;align-items:center;justify-content:space-between; height:64px;
}
.site-logo { display:flex;align-items:baseline;gap:12px; }
.site-logo-main { font-family:'Noto Serif TC',serif;font-size:18px;font-weight:500;color:var(--ink);letter-spacing:4px; }
.site-logo-sub { font-family:'Cinzel',serif;font-size:9px;letter-spacing:5px;color:var(--gold); }
.site-version {
  display:inline-flex;align-items:center; padding:3px 8px;
  font-family:'Cinzel',serif; font-size:10px; letter-spacing:2px;
  color:var(--gold); background:rgba(184,149,42,0.08);
  border:1px solid rgba(184,149,42,0.26); border-radius:999px;
}
.site-nav { display:flex;align-items:center;gap:8px; }
.nav-btn {
  padding:8px 20px; font-family:'Noto Sans TC',sans-serif;font-size:11px;letter-spacing:3px;
  color:var(--ink-faint);background:none;border:none;cursor:pointer;
  position:relative;transition:color 0.2s;
}
.nav-btn::after {
  content:'';position:absolute;bottom:0;left:20px;right:20px;
  height:1.5px;background:var(--gold);
  transform:scaleX(0);transition:transform 0.25s;
}
.nav-btn:hover{color:var(--gold);}
.nav-btn.active{color:var(--gold);}
.nav-btn.active::after{transform:scaleX(1);}

.admin-nav-btn {
  padding:6px 16px; font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:2px;
  color:var(--ink-faint); background:none; border:1px solid rgba(107,93,80,0.25);
  border-radius:1px;cursor:pointer;transition:all 0.2s; margin-left:8px;
}
.admin-nav-btn:hover{color:var(--gold);border-color:var(--gold);}
.admin-nav-btn.logged-in{color:var(--gold);border-color:var(--gold);background:var(--gold-pale);}

/* ── PAGE ── */
.page{display:none;position:relative;z-index:1;}
.page.active{display:block;}

.page-hero { text-align:center;padding:56px 32px 40px; animation:fadeDown 0.7s ease forwards; }
.page-hero-en { font-family:'Cinzel',serif;font-size:10px;letter-spacing:8px;color:var(--gold);margin-bottom:10px; }
.page-hero-title { font-size:26px;font-weight:300;letter-spacing:8px;color:var(--ink);margin-bottom:8px; }
.page-hero-desc { font-family:'Noto Sans TC',sans-serif;font-size:12px;letter-spacing:2px;color:var(--ink-faint); }
.ornament { display:flex;align-items:center;gap:14px;justify-content:center;margin:18px 0 0; }
.ornament::before,.ornament::after { content:'';height:1px;width:60px;background:linear-gradient(to right,transparent,var(--gold)); }
.ornament::after { background:linear-gradient(to left,transparent,var(--gold)); }
.ornament span { font-size:15px;color:var(--gold); }

.content-wrap { max-width:860px;margin:0 auto;padding:0 32px 80px; }

/* ── CARD ── */
.card {
  background:var(--mist);border:1px solid var(--border);border-radius:2px;
  box-shadow:0 3px 20px var(--shadow),inset 0 1px 0 rgba(255,255,255,0.5);
  animation:fadeUp 0.6s ease forwards;opacity:0;
}
.card-header { display:flex;align-items:center;gap:12px;padding:16px 26px 13px;border-bottom:1px solid rgba(184,149,42,0.1); }
.card-label { font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:4px;color:var(--gold); }
.card-body { padding:26px 30px; }

/* ── BUTTONS ── */
.btn-primary {
  display:inline-flex;align-items:center;gap:8px;padding:9px 22px; background:var(--gold);color:var(--rice);
  font-family:'Noto Sans TC',sans-serif;font-size:11px;letter-spacing:3px; border:none;cursor:pointer;border-radius:1px;transition:all 0.22s;
}
.btn-primary:hover{background:var(--gold-lt);}
.btn-outline {
  display:inline-flex;align-items:center;gap:8px;padding:8px 20px;
  background:transparent;color:var(--gold);border:1px solid var(--gold);
  font-family:'Noto Sans TC',sans-serif;font-size:11px;letter-spacing:3px; cursor:pointer;border-radius:1px;transition:all 0.22s;
}
.btn-outline:hover{background:var(--gold);color:var(--rice);}
.btn-sm{padding:5px 14px;font-size:10px;letter-spacing:2px;}
.btn-danger{border-color:var(--verm);color:var(--verm);}
.btn-danger:hover{background:var(--verm);color:var(--rice);}

/* ── DHARMA ── */
.dharma-tabs { display:flex;gap:0;margin-bottom:28px;border-bottom:1px solid var(--border); }
.dharma-tab {
  padding:10px 26px;font-family:'Noto Sans TC',sans-serif;font-size:11px;letter-spacing:3px;color:var(--ink-faint);
  background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.22s;
}
.dharma-tab:hover{color:var(--gold);}
.dharma-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.dharma-source { font-family:'Noto Sans TC',sans-serif;font-size:11px;letter-spacing:2px;color:var(--gold);margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap; }
.dharma-link { display:inline-flex;align-items:center;gap:4px;color:var(--gold);text-decoration:none;font-size:10px;letter-spacing:2px;border:1px solid rgba(184,149,42,0.38);padding:3px 10px;border-radius:1px;transition:all 0.2s; }
.dharma-link:hover{background:var(--gold);color:var(--rice);}
.dharma-text { font-size:22px;line-height:2.5;letter-spacing:0.08em;color:var(--ink);border-left:3px solid var(--gold);padding-left:22px;margin-bottom:24px; }
.dharma-reflection { font-family:'Noto Sans TC',sans-serif;font-size:13px;line-height:2.1;color:var(--ink-faint);padding:18px 22px;background:var(--gold-pale);border-radius:1px; }
.dharma-reflection strong { display:block;font-size:10px;letter-spacing:2px;color:var(--ink-light);margin-bottom:8px; }
.more-links { margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center; }
.more-link { display:inline-flex;align-items:center;gap:4px;color:var(--ink-faint);text-decoration:none;font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:1px;border:1px solid rgba(107,93,80,0.2);padding:4px 11px;border-radius:1px;transition:all 0.2s; }
.more-link:hover{color:var(--ink);border-color:var(--gold);background:var(--gold-pale);}
.btn-essay { display:inline-flex;align-items:center;gap:4px;font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:1px;color:var(--ink-faint);background:none;border:1px solid rgba(107,93,80,0.2);padding:4px 11px;border-radius:1px;cursor:pointer;transition:all 0.2s; }
.btn-essay:hover{color:var(--ink);border-color:var(--gold);background:var(--gold-pale);}
.btn-essay.linked{color:#4f8c6b;border-color:rgba(79,140,107,0.4);background:rgba(79,140,107,0.05);}
.btn-essay.linked:hover{background:rgba(79,140,107,0.1);}
.btn-lang { margin-left:auto;padding:8px 20px;font-family:'Cinzel',serif;font-size:13px;font-weight:600;letter-spacing:3px;color:var(--rice);background:var(--gold);border:1px solid var(--gold);border-radius:2px;cursor:pointer;transition:all 0.2s;box-shadow:0 2px 10px rgba(184,149,42,0.4);flex-shrink:0; }
.btn-lang:hover{background:var(--gold-lt);border-color:var(--gold-lt);}
.btn-lang.en-mode{background:var(--ink-light);border-color:var(--ink-light);}
.btn-lang.hollow{background:transparent;color:var(--gold);box-shadow:none;}
.btn-lang.hollow:hover{background:var(--gold-pale);}
.btn-lang:disabled{opacity:0.55;cursor:wait;}
.site-logo{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}

/* ── LISTS & DETAIL ── */
.history-empty { text-align:center;padding:44px 20px;font-family:'Noto Sans TC',sans-serif;font-size:13px;color:var(--ink-faint);line-height:2; }
.history-item { display:grid;grid-template-columns:minmax(220px, 240px) minmax(0, 1fr) 20px;align-items:start;gap:16px;padding:16px 0;border-bottom:1px solid rgba(184,149,42,0.09);cursor:pointer;transition:all 0.18s; }
.history-item:last-child{border-bottom:none;}
.history-item:hover{background:var(--gold-pale);margin:0 -30px;padding-left:30px;padding-right:30px;}
.history-date { display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:2px;color:var(--ink-faint);padding-top:3px;min-width:0;line-height:1.7; }
.today-badge { display:inline-flex;align-items:center;font-size:9px;letter-spacing:1px;background:var(--gold);color:var(--rice);padding:1px 7px;border-radius:1px;flex:0 0 auto; }
.history-source { font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:1px;color:var(--gold);margin-bottom:5px; }
.history-quote { font-size:15px;line-height:1.9;color:var(--ink-light);letter-spacing:0.04em; }
.history-arrow { color:rgba(184,149,42,0.35);font-size:14px;align-self:center; }
.history-item:hover .history-arrow{color:var(--gold);}
.detail-back { display:inline-flex;align-items:center;gap:8px;font-family:'Noto Sans TC',sans-serif;font-size:11px;letter-spacing:2px;color:var(--ink-faint);cursor:pointer;margin-bottom:22px;padding:6px 0;border:none;background:none;transition:color 0.2s; }
.detail-back:hover{color:var(--gold);}
.detail-date-label { font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:3px;color:var(--ink-faint);margin-bottom:18px; }

.essay-card { background:var(--mist);border:1px solid var(--border);border-radius:2px;padding:24px 28px;box-shadow:0 2px 14px var(--shadow);cursor:pointer;transition:all 0.22s;margin-bottom:16px; }
.essay-card:hover { border-color:rgba(184,149,42,0.4);box-shadow:0 4px 24px rgba(26,22,18,0.13);transform:translateY(-1px); }
.essay-card-meta { display:flex;align-items:center;gap:14px;margin-bottom:10px; }
.essay-date { font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:3px;color:var(--gold); }
.essay-tag { font-family:'Noto Sans TC',sans-serif;font-size:9px;letter-spacing:2px;background:var(--gold-pale);color:var(--gold);padding:2px 9px;border-radius:1px; }
.essay-title { font-size:17px;font-weight:500;letter-spacing:2px;color:var(--ink);margin-bottom:10px;line-height:1.7; }
.essay-excerpt { font-family:'Noto Sans TC',sans-serif;font-size:12px;line-height:2;color:var(--ink-faint);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden; }
.essay-card-footer { display:flex;justify-content:space-between;align-items:center;margin-top:14px; }
.essay-read-more { font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:2px;color:var(--gold); }

/* ── DETAIL PAGES ── */
.essay-detail-date { font-family:'Noto Sans TC',sans-serif; font-size:11px; letter-spacing:3px; color:var(--gold); margin-bottom:12px; }
.essay-detail-title { font-size:24px; font-weight:400; letter-spacing:4px; color:var(--ink); margin-bottom:8px; line-height:1.7; }
.essay-detail-divider { height:1px; background:linear-gradient(to right,var(--gold),transparent); margin:20px 0; width:120px; }
.essay-detail-body { font-family:'Noto Serif TC',serif; font-size:16px; line-height:2.4; color:var(--ink-light); text-align:justify; }
.essay-detail-body p { margin-bottom:18px; }
.essay-detail-body h1,.essay-detail-body h2,.essay-detail-body h3 { font-weight:500;letter-spacing:2px;color:var(--ink);margin:24px 0 10px;line-height:1.8; }
.essay-detail-body h1 { font-size:21px; }
.essay-detail-body h2 { font-size:18px; }
.essay-detail-body h3 { font-size:16px;color:var(--gold); }
.essay-detail-body strong { color:var(--ink);font-weight:600; }
.essay-detail-body em { font-style:italic;color:var(--ink-faint); }
.essay-detail-body blockquote { border-left:3px solid var(--gold);padding:4px 18px;margin:18px 0;color:var(--ink-faint);background:var(--gold-pale);border-radius:0 2px 2px 0; }
.essay-detail-body ul,.essay-detail-body ol { padding-left:26px;margin-bottom:16px; }
.essay-detail-body li { margin-bottom:8px; }
.essay-detail-body code { font-family:monospace;background:rgba(184,149,42,0.1);padding:2px 6px;border-radius:2px;font-size:0.88em; }
.essay-detail-body pre { background:rgba(26,22,18,0.05);padding:14px;border-radius:2px;overflow-x:auto;margin-bottom:16px; }
.essay-detail-body pre code { background:none;padding:0; }
.essay-detail-body hr { border:none;border-top:1px solid var(--border);margin:24px 0; }

/* ── MODAL ── */
.modal-overlay { display:none;position:fixed;inset:0;background:rgba(26,22,18,0.55);z-index:200;align-items:center;justify-content:center;padding:24px; }
.modal-overlay.open{display:flex;}
.modal { background:var(--rice);border:1px solid var(--border);border-radius:2px;width:100%;max-width:720px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(26,22,18,0.3); }
.modal-header { display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--border); }
.modal-title { font-family:'Noto Sans TC',sans-serif;font-size:11px;letter-spacing:4px;color:var(--gold); }
.modal-close { background:none;border:none;cursor:pointer;font-size:18px;color:var(--ink-faint); }
.modal-body { padding:28px; }
.modal-footer { display:flex;justify-content:flex-end;gap:12px;padding:16px 28px 24px; }
.form-group { margin-bottom:20px; }
.form-label { display:block;font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:3px;color:var(--gold);margin-bottom:8px; }
.form-input, .form-textarea { width:100%;padding:10px 14px;background:rgba(255,255,255,0.6);border:1px solid var(--border);border-radius:1px;font-family:'Noto Serif TC',serif;color:var(--ink);outline:none; }
.form-textarea { min-height:280px;line-height:2; }

/* ── GALLERY ── */
.gallery-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:16px; }
.gallery-item { background:var(--mist);border:1px solid var(--border);border-radius:2px;overflow:hidden;cursor:pointer;transition:all 0.25s;box-shadow:0 2px 12px var(--shadow); }
.gallery-img-wrap { width:100%;aspect-ratio:4/3;overflow:hidden; }
.gallery-img-wrap img { width:100%;height:100%;object-fit:cover; }
.gallery-info { padding:14px 16px; }
.gallery-item-title { font-size:13px;font-weight:500;letter-spacing:2px;color:var(--ink);margin-bottom:5px; }

/* ── LIGHTBOX ── */
.lightbox { display:none;position:fixed;inset:0;background:rgba(15,12,10,0.88);z-index:300;align-items:center;justify-content:center;padding:24px;flex-direction:column; }
.lightbox.open{display:flex;}
.lightbox img{max-width:100%;max-height:70vh;object-fit:contain;border:1px solid var(--border);}
.lightbox-close{position:absolute;top:24px;right:28px;background:none;border:none;cursor:pointer;color:rgba(244,239,230,0.5);font-size:24px;}

/* ── ESSAY VIEW MODAL ── */
.essay-view-body { font-family:'Noto Serif TC',serif;font-size:15px;line-height:2;color:var(--ink-light);padding:16px 0; }
.essay-view-body p { margin-bottom:14px; }
.essay-view-body h1,.essay-view-body h2,.essay-view-body h3 { font-weight:500;letter-spacing:2px;color:var(--ink);margin:18px 0 8px; }
.essay-view-body h1 { font-size:18px; }
.essay-view-body h2 { font-size:16px; }
.essay-view-body h3 { font-size:14px;color:var(--gold); }
.essay-view-body strong { color:var(--ink);font-weight:600; }
.essay-view-body em { font-style:italic;color:var(--ink-faint); }
.essay-view-body blockquote { border-left:3px solid var(--gold);padding:4px 16px;margin:14px 0;color:var(--ink-faint);background:var(--gold-pale); }
.essay-view-body ul,.essay-view-body ol { padding-left:22px;margin-bottom:12px; }
.essay-view-body li { margin-bottom:6px; }
.essay-view-body code { font-family:monospace;background:rgba(184,149,42,0.1);padding:2px 5px;border-radius:2px;font-size:0.88em; }
.essay-view-body hr { border:none;border-top:1px solid var(--border);margin:18px 0; }
.btn-unlink { font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:1px;color:var(--verm);background:none;border:1px solid rgba(155,58,42,0.3);border-radius:1px;padding:4px 12px;cursor:pointer;margin-bottom:16px; }

.loading-spinner { text-align:center;padding:48px;font-family:'Noto Sans TC',sans-serif;font-size:12px;letter-spacing:2px;color:var(--ink-faint); }
.spinner { width:24px;height:24px;border:2px solid rgba(184,149,42,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px; }

.site-footer { text-align:center;padding:32px;font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:3px;color:var(--ink-faint);opacity:0.45;border-top:1px solid var(--border);margin-top:40px; }

/* ── AUDIO PLAYER ── */
.audio-player { display:flex;align-items:center;gap:14px;padding:14px 18px;margin:18px 0 6px;background:var(--gold-pale);border:1px solid var(--border);border-radius:2px; }
.ap-play { width:44px;height:44px;flex-shrink:0;border-radius:50%;border:1px solid var(--gold);background:var(--gold);color:var(--rice);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;padding-left:2px; }
.ap-play:hover { background:var(--gold-lt); }
.ap-main { flex:1;min-width:0; }
.ap-title { font-family:'Noto Sans TC',sans-serif;font-size:11px;letter-spacing:2px;color:var(--ink-light);margin-bottom:7px; }
.ap-bar { height:5px;background:rgba(184,149,42,0.18);border-radius:3px;cursor:pointer;position:relative; }
.ap-progress { height:100%;width:0;background:var(--gold);border-radius:3px;pointer-events:none; }
.ap-time { font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:1px;color:var(--ink-faint);margin-top:6px; }
.ap-ctrls { display:flex;align-items:center;gap:6px;flex-shrink:0; }
.ap-btn { font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:0.5px;color:var(--ink-light);background:rgba(255,255,255,0.5);border:1px solid var(--border);border-radius:2px;padding:6px 9px;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap; }
.ap-btn:hover { color:var(--gold);border-color:var(--gold); }
.audio-pending { display:flex;align-items:center;gap:10px;padding:12px 18px;margin:18px 0 6px;background:var(--gold-pale);border:1px solid var(--border);border-radius:2px;font-family:'Noto Sans TC',sans-serif;font-size:11px;letter-spacing:2px;color:var(--ink-faint); }
.audio-pending .spinner { width:16px;height:16px;border-width:2px;margin:0; }
.speech-block { transition:background 0.4s;border-radius:2px; }
.speech-block.clickable { cursor:pointer; }
.speech-block.speaking { background:var(--gold-pale);box-shadow:0 0 0 8px var(--gold-pale); }
.essay-audio-badge { font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:1px;color:var(--gold); }
.audio-gen-label { display:flex;align-items:center;gap:9px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:12px;letter-spacing:1px;color:var(--ink-light); }

<script>
// --- MATH RENDERING START ---
function initMathRendering(element) {
  if (typeof renderMathInElement === 'function') {
    renderMathInElement(element, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      throwOnError: false
    });
  }
}
// --- MATH RENDERING END ---

function renderMarkdown(text) {
  if (typeof marked === 'undefined') return escHtml(text || '').replace(/\n/g,'<br>');
  // CommonMark treats CJK punctuation (「」（）etc.) as punctuation chars, which breaks
  // left/right-flanking detection for ** and * — pre-convert them to HTML first.
  const processed = (text || '')
    .replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(?<!\*)\*(?!\*)([^*\n]+)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
  return marked.parse(processed, { breaks: true });
}

const ADMIN_TOKEN_KEY = 'bf_admin_token';
let isAdmin = Boolean(sessionStorage.getItem(ADMIN_TOKEN_KEY));
let _dharmaEnMode = false;
let _todayDharma = null;
let _essayModalId = null;
let _formDirty = false;
let _editingType = 'essay';

async function apiGet(path) { const r = await fetch(path); if (!r.ok) return null; try { return await r.json(); } catch { return null; } }
async function apiPost(path, body) { const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+sessionStorage.getItem(ADMIN_TOKEN_KEY)}, body:JSON.stringify(body) }); return {ok:r.ok, data:await r.json()}; }
async function apiPut(path, body) { const r = await fetch(path, { method:'PUT', headers:{'Content-Type':'application/json','Authorization':'Bearer '+sessionStorage.getItem(ADMIN_TOKEN_KEY)}, body:JSON.stringify(body) }); return {ok:r.ok, data:await r.json()}; }
async function apiDelete(path) { const r = await fetch(path, { method:'DELETE', headers:{'Authorization':'Bearer '+sessionStorage.getItem(ADMIN_TOKEN_KEY)} }); return r.ok; }

// 管理員入口已隱藏：桌機雙擊 Logo、手機長按 Logo（0.7 秒）呼出登入；已登入則詢問登出
function adminGesture() {
  if (isAdmin) {
    if (confirm('登出管理員？')) { isAdmin = false; sessionStorage.removeItem(ADMIN_TOKEN_KEY); location.reload(); }
  } else {
    openModal('loginModal');
    setTimeout(() => document.getElementById('adminPassword').focus(), 100);
  }
}
function bindAdminGesture() {
  const logo = document.getElementById('siteLogo');
  logo.addEventListener('dblclick', (e) => { e.preventDefault(); adminGesture(); });
  let lp = null;
  logo.addEventListener('touchstart', () => { lp = setTimeout(() => { lp = null; adminGesture(); }, 700); }, { passive: true });
  ['touchend', 'touchmove', 'touchcancel'].forEach(ev =>
    logo.addEventListener(ev, () => { if (lp) { clearTimeout(lp); lp = null; } }, { passive: true }));
}
async function doLogin() {
  const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:document.getElementById('adminPassword').value}) });
  if(res.ok){ const data = await res.json(); isAdmin=true; sessionStorage.setItem(ADMIN_TOKEN_KEY, data.token); location.reload(); }
  else { document.getElementById('loginError').style.display='block'; }
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function todayKey() { return new Date().toLocaleDateString('sv-SE', {timeZone:'Asia/Kuala_Lumpur'}); }

function parseDate(dateStr) {
  if (!dateStr) return null;
  const cleanStr = dateStr.replace(' ', 'T');
  const d = new Date(cleanStr);
  if (isNaN(d.getTime())) {
    const [y, m, day] = dateStr.split('-').map(Number);
    return new Date(y, m - 1, day);
  }
  return d;
}

function formatDate(iso) {
  const d = parseDate(iso); if (!d) return '日期不詳';
  return d.toLocaleDateString('zh-Hant-TW', {year:'numeric',month:'long',day:'numeric',weekday:'long'});
}
function formatDateEn(iso) {
  const d = parseDate(iso); if (!d) return 'Unknown Date';
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

async function fetchTodayDharma() { _todayDharma = await apiGet('/api/dharma/history/' + todayKey()); renderTodayDharma(); }

function renderDharmaEntry(zh, en, dateLbl, mode, shareHash) {
  const alts = (zh.alt_links ? JSON.parse(zh.alt_links) : []).map(l => `<a class="more-link" href="${l.url}" target="_blank">↗ ${l.label}</a>`).join('');
  const shareBtn = shareHash ? `<button class="btn-share" onclick="shareUrl('${shareHash}')">↗ 分享連結</button>` : '';
  if (mode === 'en') {
    return `${dateLbl ? `<div class="detail-date-label">${dateLbl}</div>` : ''}
      <div class="dharma-source" style="flex-direction:column;gap:6px"><span style="font-family:'Noto Sans TC',sans-serif;font-size:10px;color:var(--ink-faint)">${zh.source}</span><span>${en ? en.source_en : zh.source}</span></div>
      <div class="dharma-text" style="font-size:18px">${en ? en.text_en : zh.text}</div>
      <div class="dharma-reflection"><strong>REFLECTION</strong>${en ? en.reflection_en : 'Translation pending.'}</div>
      <div class="more-links"><button class="btn-essay" onclick="handleEssayClick('${escAttr(zh.source)}',this)">心得</button>${shareBtn}${isAdmin?`<button class="btn-regen" onclick="regenerateDharma('${zh.date}',this)">↺ 重新產生</button>`:''}</div>`;
  } else {
    return `${dateLbl ? `<div class="detail-date-label">${dateLbl}</div>` : ''}
      <div class="dharma-source"><span>出處：${zh.source}</span>${zh.cbeta_url ? `<a class="dharma-link" href="${zh.cbeta_url}" target="_blank">☸ ${zh.cbeta_label || 'CBETA'}</a>` : ''}</div>
      <div class="dharma-text">${zh.text}</div>
      ${zh.reflection ? `<div class="dharma-reflection"><strong>今日思索</strong>${zh.reflection}</div>` : ''}
      <div class="more-links">${alts}<button class="btn-essay" onclick="handleEssayClick('${escAttr(zh.source)}',this)">心得</button>${shareBtn}${isAdmin?`<button class="btn-regen" onclick="regenerateDharma('${zh.date}',this)">↺ 重新產生</button>`:''}</div>`;
  }
}

async function handleEssayClick(source, btn) {
  btn.disabled = true; const essays = await apiGet('/api/essays?dharma_source=' + encodeURIComponent(source)); btn.disabled = false;
  if (essays && essays.length) { showEssayModal(essays[0]); } else if (isAdmin) { openEssayEditor(null, source); }
}
function showEssayModal(essay) {
  document.getElementById('essayViewTitle').textContent = essay.title;
  const viewContent = document.getElementById('essayViewContent');
  viewContent.innerHTML = renderMarkdown(essay.content);
  initMathRendering(viewContent);
  document.getElementById('essayViewMeta').innerHTML = `<span style="font-size:11px;color:var(--ink-faint)">${formatDate(essay.created_at)}</span>`;
  document.getElementById('essayViewUnlink').style.display = isAdmin ? 'block' : 'none';
  _essayModalId = essay.id; openModal('essayViewModal');
}
async function unlinkEssayFromDharma() { if(confirm('移除連結？')){ await apiPut('/api/essays/'+_essayModalId, {dharma_source:null}); closeModal('essayViewModal'); } }

async function regenerateDharma(date, btn) {
  if (!confirm(`重新產生 ${date} 的每日佛典？\n（目前內容將被替換）`)) return;
  btn.disabled = true; btn.textContent = '產生中…';
  const r = await apiPost('/api/dharma/regenerate', { date });
  if (r.ok) {
    const today = todayKey();
    if (date === today) { _todayDharma = r.data; await renderTodayDharma(); }
    else if (document.getElementById('enHistoryBody') && document.querySelector('#enHistoryBody .detail-back')) { await showDharmaEnDetail(date); }
    else { await showDharmaDetail(date); }
  } else {
    btn.disabled = false; btn.textContent = '↺ 重新產生';
    alert('產生失敗，請稍後再試');
  }
}

async function renderTodayDharma() {
  if(!_todayDharma) return;
  const btn = document.getElementById('langToggleBtn'); const body = document.getElementById('dharmaBody');
  const shareHash = '#dharma/' + _todayDharma.date;
  if(!_dharmaEnMode){ btn.textContent='EN'; btn.classList.remove('en-mode'); body.innerHTML = renderDharmaEntry(_todayDharma, null, null, 'zh', shareHash); }
  else { btn.textContent='中'; btn.classList.add('en-mode'); const enArr = await apiGet('/api/dharma/en?source=' + encodeURIComponent(_todayDharma.source)); body.innerHTML = renderDharmaEntry(_todayDharma, enArr?.[0], null, 'en', shareHash); }
}
function toggleDharmaLang() { _dharmaEnMode = !_dharmaEnMode; renderTodayDharma(); }

function switchDharmaTab(tab) {
  ['dtab-today','dtab-history','dtab-en-history'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById('dtab-'+tab).classList.add('active');
  document.getElementById('dharma-today-card').style.display = tab==='today'?'block':'none';
  document.getElementById('dharma-history-wrap').style.display = tab==='history'?'block':'none';
  document.getElementById('dharma-en-history-wrap').style.display = tab==='en-history'?'block':'none';
  if(tab==='today') renderTodayDharma(); else if(tab==='history') renderDharmaHistory(); else renderDharmaEnHistory();
}

async function renderDharmaHistory() {
  history.replaceState(null,'','#dharma-history');
  const rows = await apiGet('/api/dharma/history'); const body = document.getElementById('historyBody');
  if(!rows || !rows.length){ body.innerHTML='尚無紀錄'; return; }
  const tk = todayKey();
  body.innerHTML = rows.map(e => `<div class="history-item" onclick="showDharmaDetail('${e.date}')"><div class="history-date">${formatDate(e.date)}${e.date===tk?'<span class="today-badge">今日</span>':''}</div><div><div class="history-source">${e.source}</div><div class="history-quote">${e.text}</div></div><div class="history-arrow">›</div></div>`).join('');
}
async function showDharmaDetail(iso, lang) {
  lang = lang || 'zh';
  const zh = await apiGet('/api/dharma/history/'+iso);
  const en = lang === 'en' ? (await apiGet('/api/dharma/en?source=' + encodeURIComponent(zh.source)))?.[0] : null;
  history.replaceState(null,'','#dharma/'+iso);
  document.getElementById('historyBody').innerHTML =
    `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <button class="detail-back" style="margin-bottom:0" onclick="renderDharmaHistory()">‹ 返回</button>
      <button class="btn-lang ${lang==='en'?'en-mode':''}" onclick="showDharmaDetail('${iso}','${lang==='en'?'zh':'en'}')">${lang==='en'?'中':'EN'}</button>
    </div>` +
    renderDharmaEntry(zh, en, lang==='en' ? formatDateEn(iso) : formatDate(iso), lang, '#dharma/'+iso);

// ── 語音播放器 ──
// 段落切分：必須與後端 tts.js 的 splitBlocks() 完全一致
function splitBlocks(content) { return (content || '').split(/\n{2,}/); }
function fmtMinutes(sec) { return Math.max(1, Math.round((sec||0)/60)) + ' 分鐘'; }
function fmtTime(sec) { sec=Math.max(0,Math.floor(sec||0)); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
let _apPoll = null;
const AP_SPEEDS = [0.8, 1, 1.25, 1.5];

function apCleanup() {
  const a = document.getElementById('essayAudio');
  if (a) a.pause();
  if (_apPoll) { clearInterval(_apPoll); _apPoll = null; }
  if (typeof _trPoll !== 'undefined' && _trPoll) { clearInterval(_trPoll); _trPoll = null; }
}

    const audioSrc = `/api/essays/${e.id}/audio.mp3?v=${encodeURIComponent(e.audio_updated_at||'')}`;
    return `<div class="audio-player">
      <audio id="essayAudio" src="${audioSrc}" preload="metadata"></audio>
      <button class="ap-play" id="apPlay" onclick="apToggle()" title="播放 / 暫停">▶</button>
      <div class="ap-main">

        <div class="ap-bar" id="apBar" onclick="apSeekBar(event)"><div class="ap-progress" id="apProgress"></div></div>
        <div class="ap-time" id="apTime">0:00 / ${fmtTime(e.audio_duration)}</div>
      </div>
      <div class="ap-ctrls">
        <button class="ap-btn" onclick="apSkip(-15)" title="倒退 15 秒">↺ 15</button>
        <button class="ap-btn" onclick="apSkip(15)" title="快轉 15 秒">15 ↻</button>
        <button class="ap-btn" id="apSpeed" onclick="apCycleSpeed()" title="播放速度">1×</button>
        <a class="ap-btn" href="${audioSrc}&download=1" title="下載 MP3 離線聆聽">⬇ MP3</a>

async function handleMantraAudioSelected(ev) {
  const input = ev.target, file = input.files && input.files[0], id = input.dataset.id;
  if (!file || !id) return;
  if (file.size > 30 * 1024 * 1024) { showToast('MP3 不可超過 30 MB'); return; }
  const btn = document.getElementById('uploadAudioBtn'); if (btn) { btn.disabled = true; btn.textContent = '上傳中…'; }
  try {
    const url = URL.createObjectURL(file);
    const duration = await new Promise((resolve, reject) => {
      const audio = new Audio();
      audio.onloadedmetadata = () => { URL.revokeObjectURL(url); resolve(audio.duration); };
      audio.onerror = () => { URL.revokeObjectURL(url); reject(new Error('無法讀取音檔時長')); };
      audio.src = url;
    });
    if (!Number.isFinite(duration) || duration <= 0) throw new Error('無法讀取音檔時長');
    const r = await fetch(`/api/essays/${id}/audio/upload?duration=${encodeURIComponent(duration)}`, { method:'POST', body:file, headers:{'Content-Type':'audio/mpeg','Authorization':'Bearer '+sessionStorage.getItem(ADMIN_TOKEN_KEY)} });
    if (!r.ok) { const data = await r.json().catch(()=>({})); throw new Error(data.error || '上傳失敗'); }
    showToast('MP3 上傳完成'); showEssayPageDetail(id,false,'mantra');
  } catch (e) { showToast(e.message || '上傳失敗'); if (btn) { btn.disabled = false; btn.textContent = '⬆ 上傳 MP3'; } }
}

function apToggle() {
  const a = document.getElementById('essayAudio');
  if (!a) return;
  if (a.paused) a.play(); else a.pause();
}
function apSkip(sec) {
  const a = document.getElementById('essayAudio');
  if (!a) return;
  const max = isFinite(a.duration) && a.duration > 0.5 ? a.duration - 0.5 : Infinity;
  const t = Math.max(0, Math.min(max, a.currentTime + sec));
  if (isFinite(t)) a.currentTime = t;
}
// 使用者選定的速度（單一事實來源）。不從 a.playbackRate 推算——
// 瀏覽器重新載入媒體（切背景分頁再回來等）會把 playbackRate 重設回 1，
// 若照舊值推算，按鈕會與實際速度脫鉤、看似失效。
let _apSpeed = 1;
function apApplySpeed(rate) {
  _apSpeed = rate;
  const a = document.getElementById('essayAudio');
  if (a) a.playbackRate = rate;
  localStorage.setItem('bf_audio_speed', rate);
  const btn = document.getElementById('apSpeed');
  if (btn) btn.textContent = rate + '×';
}
function apCycleSpeed() {
  const cur = AP_SPEEDS.indexOf(_apSpeed);
  apApplySpeed(AP_SPEEDS[(cur + 1) % AP_SPEEDS.length]);
}
function apSeekBar(ev) {
  const a = document.getElementById('essayAudio');
  const bar = document.getElementById('apBar');
  if (!a || !bar || !isFinite(a.duration)) return;
  const rect = bar.getBoundingClientRect();
  a.currentTime = ((ev.clientX - rect.left) / rect.width) * a.duration;
}

function apBindPlayer(e) {
  const a = document.getElementById('essayAudio');
  if (!a) return;
  const timings = e.audio_timings ? JSON.parse(e.audio_timings) : [];
  const saved = parseFloat(localStorage.getItem('bf_audio_speed'));
  apApplySpeed(AP_SPEEDS.includes(saved) ? saved : 1);
  // 瀏覽器可能在重新載入媒體後把 playbackRate 重設回 1——一偵測到就套回使用者選的速度
  a.onratechange = () => { if (a.playbackRate !== _apSpeed) a.playbackRate = _apSpeed; };
  a.onloadedmetadata = () => { if (a.playbackRate !== _apSpeed) a.playbackRate = _apSpeed; };
  const playBtn = document.getElementById('apPlay');
  a.onplay = () => { playBtn.textContent = '❚❚'; playBtn.style.paddingLeft = '0'; if (a.playbackRate !== _apSpeed) a.playbackRate = _apSpeed; };
  a.onpause = () => { playBtn.textContent = '▶'; playBtn.style.paddingLeft = '2px'; };
  let lastIdx = null;
  a.ontimeupdate = () => {
    const dur = isFinite(a.duration) && a.duration ? a.duration : e.audio_duration;
    document.getElementById('apProgress').style.width = (dur ? (a.currentTime / dur * 100) : 0) + '%';
    document.getElementById('apTime').textContent = fmtTime(a.currentTime) + ' / ' + fmtTime(dur);
    // 段落同步反白
    let cur = null;
    for (const t of timings) { if (a.currentTime >= t.t) cur = t; else break; }
    const idx = cur ? cur.i : null;
    if (idx === lastIdx) return;
    lastIdx = idx;
    document.querySelectorAll('.speech-block.speaking, .essay-detail-title.speaking').forEach(el => el.classList.remove('speaking'));
    if (idx === null || a.paused && a.currentTime === 0) return;
    const el = idx === -1 ? document.querySelector('.essay-detail-title') : document.querySelector(`.speech-block[data-bi="${idx}"]`);
    if (el) {
      el.classList.add('speaking');
      const r = el.getBoundingClientRect();
      if (r.top < 70 || r.bottom > window.innerHeight - 40) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  };
  a.onended = () => { document.querySelectorAll('.speaking').forEach(el => el.classList.remove('speaking')); };
  // 點段落 → 從該段開始播放
  const startable = new Map(timings.filter(t => t.i >= 0).map(t => [t.i, t.t]));
  document.querySelectorAll('.speech-block').forEach(el => {
    const bi = parseInt(el.dataset.bi, 10);
    if (!startable.has(bi)) return;
    el.classList.add('clickable');
    el.title = '從此段開始播放';
    el.addEventListener('click', (ev) => {
      if (ev.target.closest('a')) return;
      a.currentTime = startable.get(bi);
      a.play();
    });
  });
}

let _trPoll = null;
async function requestEssayTranslation(id, type='essay') {
  if (!confirm('本篇尚未存有英文版本，是否現在為您產生？\n（約需一至兩分鐘，完成後會自動切換）')) return;
  const r = await fetch('/api/essays/'+id+'/translate', { method:'POST' }).then(x=>x.json()).catch(()=>null);
  if (!r || !r.ok) { alert('翻譯服務暫時無法使用，請稍後再試'); return; }
  if (r.status === 'ready') { _essayEnMode = true; showEssayPageDetail(id, true, type); return; }
  showToast('英文版翻譯中…');
  showEssayPageDetail(id, true, type); // 重新渲染成「翻譯中…」並開始輪詢
}
function watchEssayTranslation(id, type='essay') {
  if (_trPoll) clearInterval(_trPoll);
  _trPoll = setInterval(async () => {
    if (location.hash !== '#'+type+'/'+id) { clearInterval(_trPoll); _trPoll = null; return; }
    const fresh = await apiGet('/api/essays/'+id);
    if (!fresh) return;
    if (fresh.content_en) { clearInterval(_trPoll); _trPoll = null; _essayEnMode = true; showEssayPageDetail(id, true, type); }
    else if (fresh.translate_status === 'error') { clearInterval(_trPoll); _trPoll = null; showToast('翻譯失敗，請稍後再試'); showEssayPageDetail(id, true, type); }
  }, 4000);
}

  const hash = location.hash;
  if (!hash || hash === '#') return;
  function activatePage(name) {
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById('page-'+name).classList.add('active');
    const btn = document.querySelector(`.nav-btn[onclick*="${name}"]`);
    if(btn) btn.classList.add('active');
  }
  function activateDharmaTab(tab) {
    ['dtab-today','dtab-history','dtab-en-history'].forEach(tid => document.getElementById(tid).classList.remove('active'));
    document.getElementById('dtab-'+tab).classList.add('active');
    document.getElementById('dharma-today-card').style.display = tab==='today'?'block':'none';
    document.getElementById('dharma-history-wrap').style.display = tab==='history'?'block':'none';
    document.getElementById('dharma-en-history-wrap').style.display = tab==='en-history'?'block':'none';
  }
  // 區塊總頁面（可直接分享的固定網址）
  if (hash === '#essays')  { activatePage('essays');  return renderEssayList(); }
  if (hash === '#mantras') { activatePage('mantras'); return renderMantraList(); }
  if (hash === '#gallery') { activatePage('gallery'); return renderGallery(); }
  if (hash === '#dharma-history')    { activateDharmaTab('history');    return renderDharmaHistory(); }
  if (hash === '#dharma-en-history') { activateDharmaTab('en-history'); return renderDharmaEnHistory(); }
  const m = hash.match(/^#(dharma-en|dharma|essay|mantra)\/(.+)$/);
  if (!m) return;
  const [, type, id] = m;
  if (type === 'dharma') {
    activateDharmaTab('history'); await showDharmaDetail(id);
  } else if (type === 'dharma-en') {
    activateDharmaTab('en-history'); await showDharmaEnDetail(id);
  } else if (type === 'essay') {
    activatePage('essays'); await showEssayPageDetail(id);
  } else if (type === 'mantra') {
    activatePage('mantras'); await showMantraPageDetail(id);
  }
}
document.addEventListener('DOMContentLoaded', () => { bindAdminGesture(); fetchTodayDharma(); routeFromHash(); });
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  const lb=document.getElementById('lightbox');
  if(lb&&lb.classList.contains('open')){lb.classList.remove('open');return;}
  const om=document.querySelector('.modal-overlay.open');
  if(om){
    if(om.id==='essayModal'){ closeEssayModalSafe(); return; }
    om.classList.remove('open');return;
  }
  const back=document.querySelector('.detail-back');
  if(back)back.click();
});
</script>
